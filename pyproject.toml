[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-miner-rsi"
version = "0.1.0"
description = "An offline RSI recursive research agent coordinated by DeepSeek Harness"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Mengrui-byte" }]
keywords = ["rsi", "quantitative-research", "agent", "mcp", "deepseek-harness"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3.12"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
rsi-research = "rsi_harness.cli:main"
rsi-mcp-serve = "rsi_harness.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Mengrui-byte/FactorMiner"
Repository = "https://github.com/Mengrui-byte/FactorMiner"

[tool.setuptools.packages.find]
include = ["rsi_harness*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["rsi_harness/tests"]
addopts = "-q --tb=short"
