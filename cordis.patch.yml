# The single production integration path: DeepSeek Harness owns orchestration.
# The host supplies DIGITALSCHOLAR_ROOT and RSI_HARNESS_ROOT.
- insert:
    - id: digital-scholar
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: scholar
        transport: stdio
        command: "${DIGITALSCHOLAR_PYTHON:-python}"
        args: ["${DIGITALSCHOLAR_ROOT}/engine/mcp/scholar_mcp.py"]
        cwd: "${DIGITALSCHOLAR_ROOT}"
        failOnStartupError: true
        toolCallTimeoutMs: 600000
    - id: rsi-harness
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: rsi
        transport: stdio
        command: "${RSI_HARNESS_PYTHON:-python}"
        args: [-m, rsi_harness.mcp_server, --transport, stdio]
        cwd: "${RSI_HARNESS_ROOT:-.}"
        failOnStartupError: true
        toolCallTimeoutMs: 1800000
