# DeepSeek Harness overlay for the RSI recursive research controller.
# Set DIGITALSCHOLAR_ROOT, DIGITALSCHOLAR_PYTHON, and FACTORMINER_ROOT in the
# Harness host environment. This file contains no machine-specific paths.
- insert:
    - id: digital-scholar
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: scholar
        transport: stdio
        command: ${DIGITALSCHOLAR_PYTHON:-python}
        args:
          - ${DIGITALSCHOLAR_ROOT}/engine/mcp/scholar_mcp.py
        cwd: ${DIGITALSCHOLAR_ROOT}
        env: {}
        failOnStartupError: false
        toolCallTimeoutMs: 600000
    - id: rsi-factor-miner
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: factor
        transport: stdio
        command: ${FACTOR_MINER_PYTHON:-python}
        args:
          - -m
          - rsi_harness.mcp_server
          - --transport
          - stdio
        cwd: ${FACTORMINER_ROOT:-.}
        env: {}
        failOnStartupError: true
        toolCallTimeoutMs: 1800000
